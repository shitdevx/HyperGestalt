name: HyperGestalt Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exploits:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -p; xcodebuild -version
      - name: Create fileport.h shim for darksword (sys/fileport.h not in iPhoneOS SDK)
        run: |
          # Makefile uses -I../.include from external/darksword-kexploit => external/.include
          mkdir -p external/.include/sys
          cat > external/.include/sys/fileport.h << 'EOF'
          #ifndef _SYS_FILEPORT_H_
          #define _SYS_FILEPORT_H_
          #include <mach/mach.h>
          typedef mach_port_t fileport_t;
          kern_return_t fileport_makeport(int fd, mach_port_t *portname);
          int fileport_makefd(mach_port_t portname);
          #endif
          EOF
          cat external/.include/sys/fileport.h
          ls -R external/.include
          # Also keep copy for direct include
          mkdir -p external/darksword-kexploit/.include/sys
          cp external/.include/sys/fileport.h external/darksword-kexploit/.include/sys/fileport.h
          cp HyperGestalt/Bridging/include/sys/fileport.h external/.include/sys/fileport.h || true
      - name: Build darksword-kexploit (arm64/arm64e, iOS 15.0+)
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          # Makefile default target is 'sign' which requires ldid; build binary directly
          make -C external/darksword-kexploit darksword-pe
          file external/darksword-kexploit/darksword-pe
          ls -lh external/darksword-kexploit/darksword-pe || true
          # Optional ldid signing (Theos ldid)
          if command -v ldid >/dev/null 2>&1; then ldid -Sentitlements.plist external/darksword-kexploit/darksword-pe && echo "signed"; else echo "ldid not found, skip sign (install via brew install ldid)"; fi
      - name: Build clipwire (arm64e, iOS 26.1 A13)
        run: |
          # Clipwire requires private XNU headers (mach/mach_vm.h) not in iPhoneOS17.5.sdk
          # Builds on-device with theos/jailbroken toolchain; CI build is best-effort
          make -C external/clipwire || echo "clipwire build failed (expected on Xcode 15.4 iPhoneOS SDK, requires private headers) - skipping"
          file external/clipwire/clipwire 2>&1 || echo "clipwire binary not produced (requires device toolchain)"
          ls -lh external/clipwire/clipwire 2>&1 || true
          if command -v ldid >/dev/null 2>&1 && [ -f external/clipwire/clipwire ]; then ldid -Sentitlements.plist external/clipwire/clipwire; else echo "ldid not found or no binary"; fi
      - name: Verify bad_query sources
        run: |
          ls -lh external/bad_query/bad_query/bad_query.h external/bad_query/bad_query/bad_query.c
          cat external/bad_query/bad_query/bad_query.h
      - name: Upload exploit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exploit-binaries
          path: |
            external/darksword-kexploit/darksword-pe
            external/clipwire/clipwire

  build-app:
    runs-on: macos-14
    needs: build-exploits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -p; xcodebuild -version; swift --version
      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true; xcodegen --version
      - name: Generate Xcode project via XcodeGen
        run: |
          ls -lh project.yml HyperGestalt/Info.plist || true
          xcodegen generate --spec project.yml
          # XcodeGen generates objectVersion 77 (Xcode 16) but runner has Xcode 15.4 (max 56) - downgrade
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' HyperGestalt.xcodeproj/project.pbxproj || sed -i 's/objectVersion = 77/objectVersion = 56/g' HyperGestalt.xcodeproj/project.pbxproj
          grep objectVersion HyperGestalt.xcodeproj/project.pbxproj || true
          ls -lh HyperGestalt.xcodeproj/ 2>&1 | head -20
          cat HyperGestalt.xcodeproj/project.pbxproj | head -50
      - name: Build HyperGestalt app (iOS 15.0+, CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild -project HyperGestalt.xcodeproj -scheme HyperGestalt -sdk iphoneos -configuration Debug clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty || xcodebuild -project HyperGestalt.xcodeproj -scheme HyperGestalt -sdk iphoneos -configuration Debug clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          ls -lh build/ 2>&1 | head -20
      - name: Archive and export IPA (unsigned + TrollStore ldid)
        run: |
          xcodebuild archive -project HyperGestalt.xcodeproj -scheme HyperGestalt -sdk iphoneos -configuration Release -archivePath build/HyperGestalt.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=NO || true
          ls -lh build/HyperGestalt.xcarchive/ 2>&1 | head -20 || echo "archive not created"
          ls -lh build/HyperGestalt.xcarchive/Products/Applications/ 2>&1 | head -20 || true
          # Also plain build for Payload
          xcodebuild -project HyperGestalt.xcodeproj -scheme HyperGestalt -sdk iphoneos -configuration Release build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT=build/sym 2>&1 | tail -20 || true
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/HyperGestalt.xcarchive -name "HyperGestalt.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "HyperGestalt.app" -type d 2>/dev/null | head -1); fi
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find build -name "HyperGestalt.app" -type d 2>/dev/null | head -1); fi
          if [ -n "$APP_PATH" ]; then echo "Found app at $APP_PATH"; ls -lh "$APP_PATH" | head -30; cp -R "$APP_PATH" build/ipa/Payload/; else echo "No app found"; ls -R build 2>&1 | head -100; fi
          echo "=== Payload contents ==="
          ls -lhR build/ipa/Payload 2>&1 | head -100 || true
          # Fix malformed IPA: remove Bridging resource folder if present (was incorrectly copied as resource)
          rm -rf build/ipa/Payload/HyperGestalt.app/Bridging 2>&1 || true
          # Install ldid for TrollStore fake signing
          brew install ldid 2>&1 | tail -5 || true
          if command -v ldid >/dev/null 2>&1 && [ -d build/ipa/Payload/HyperGestalt.app ]; then
            echo "ldid found, signing for TrollStore..."
            ldid -S HyperGestalt/HyperGestalt.entitlements build/ipa/Payload/HyperGestalt.app/HyperGestalt 2>&1 || ldid -S build/ipa/Payload/HyperGestalt.app/HyperGestalt 2>&1 || echo "ldid failed"
            # Verify
            ldid -e build/ipa/Payload/HyperGestalt.app/HyperGestalt 2>&1 | head -30 || true
            file build/ipa/Payload/HyperGestalt.app/HyperGestalt
            otool -l build/ipa/Payload/HyperGestalt.app/HyperGestalt 2>&1 | head -40 || true
          else
            echo "ldid not found or no app, skipping TrollStore sign"
            file build/ipa/Payload/HyperGestalt.app/HyperGestalt 2>&1 || true
          fi
          if [ -d build/ipa/Payload/HyperGestalt.app ]; then
            # Ensure binary is executable and has correct perms (fixes ZMachO MapFile)
            chmod +x build/ipa/Payload/HyperGestalt.app/HyperGestalt 2>&1 || true
            cd build/ipa && zip -r -y ../HyperGestalt.ipa Payload && cd ../.. && ls -lh build/HyperGestalt.ipa && unzip -l build/HyperGestalt.ipa | head -40
            # Also create TrollStore variant
            cp build/HyperGestalt.ipa build/HyperGestalt-TrollStore.ipa 2>&1 || true
            ls -lh build/*.ipa
          fi
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperGestalt-ipa
          path: |
            build/HyperGestalt.ipa
            build/HyperGestalt-TrollStore.ipa
            build/HyperGestalt.xcarchive
          if-no-files-found: warn
