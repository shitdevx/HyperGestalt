name: HyperGestalt Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exploits:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -p; xcodebuild -version
      - name: Create fileport.h shim
        run: |
          mkdir -p external/.include/sys
          cat > external/.include/sys/fileport.h << 'SEOF'
          #ifndef _SYS_FILEPORT_H_
          #define _SYS_FILEPORT_H_
          #include <mach/mach.h>
          typedef mach_port_t fileport_t;
          kern_return_t fileport_makeport(int fd, mach_port_t *portname);
          int fileport_makefd(mach_port_t portname);
          #endif
          SEOF
          mkdir -p external/darksword-kexploit/.include/sys
          cp external/.include/sys/fileport.h external/darksword-kexploit/.include/sys/fileport.h
      - name: Build darksword-kexploit
        run: |
          make -C external/darksword-kexploit darksword-pe
          file external/darksword-kexploit/darksword-pe
          ls -lh external/darksword-kexploit/darksword-pe
      - name: Build clipwire (best-effort)
        run: |
          make -C external/clipwire || echo "clipwire skipped (needs private headers)"
          file external/clipwire/clipwire 2>&1 || true
      - name: Verify bad_query sources
        run: ls -lh external/bad_query/bad_query/bad_query.h external/bad_query/bad_query/bad_query.c
      - name: Upload exploit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exploit-binaries
          path: |
            external/darksword-kexploit/darksword-pe
            external/clipwire/clipwire

  build-app:
    runs-on: macos-14
    needs: build-exploits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true; xcodebuild -version
      - name: Install XcodeGen + ldid
        run: |
          brew install xcodegen ldid 2>&1 | tail -5 || true
          xcodegen --version
          ldid 2>&1 | head -1 || echo "ldid not available"
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' HyperGestalt.xcodeproj/project.pbxproj 2>/dev/null || sed -i 's/objectVersion = 77/objectVersion = 56/g' HyperGestalt.xcodeproj/project.pbxproj 2>/dev/null || true
          grep objectVersion HyperGestalt.xcodeproj/project.pbxproj
      - name: Build app
        run: |
          xcodebuild \
            -project HyperGestalt.xcodeproj \
            -scheme HyperGestalt \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            2>&1 | xcpretty || \
          xcodebuild \
            -project HyperGestalt.xcodeproj \
            -scheme HyperGestalt \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          set -e
          echo "=== Looking for built .app ==="
          APP=$(find build/DD -name "HyperGestalt.app" -type d -mindepth 4 | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: HyperGestalt.app not found in build/DD"
            find build/DD -name "*.app" -type d 2>/dev/null || true
            find build/DD -name "HyperGestalt" -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP"
          ls -la "$APP/"
          BINARY="$APP/HyperGestalt"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: No binary at $BINARY"
            ls -la "$APP/"
            exit 1
          fi
          echo "=== Binary info ==="
          file "$BINARY"
          ls -lh "$BINARY"
          otool -l "$BINARY" | head -40
          echo "=== Packaging IPA ==="
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          rm -rf build/ipa/Payload/HyperGestalt.app/Bridging 2>/dev/null || true
          chmod +x build/ipa/Payload/HyperGestalt.app/HyperGestalt
          if command -v ldid >/dev/null 2>&1; then
            echo "Signing with ldid for TrollStore..."
            ldid -SHyperGestalt/HyperGestalt.entitlements build/ipa/Payload/HyperGestalt.app/HyperGestalt
            echo "=== Signed entitlements ==="
            ldid -e build/ipa/Payload/HyperGestalt.app/HyperGestalt
          else
            echo "WARNING: ldid not found, IPA will be unsigned"
          fi
          cd build/ipa
          zip -r -y ../HyperGestalt.ipa Payload
          cd ../..
          echo "=== IPA contents ==="
          unzip -l build/HyperGestalt.ipa
          echo "=== IPA size ==="
          ls -lh build/HyperGestalt.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HyperGestalt-ipa
          path: build/HyperGestalt.ipa
          if-no-files-found: error
