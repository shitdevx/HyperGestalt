name: HyperGestalt Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exploits:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -p; xcodebuild -version
      - name: Create fileport.h shim for darksword (sys/fileport.h not in iPhoneOS SDK)
        run: |
          mkdir -p external/darksword-kexploit/.include/sys
          cat > external/darksword-kexploit/.include/sys/fileport.h << 'EOF'
          #ifndef _SYS_FILEPORT_H_
          #define _SYS_FILEPORT_H_
          #include <sys/cdefs.h>
          #include <sys/types.h>
          #include <mach/mach.h>
          __BEGIN_DECLS
          kern_return_t fileport_makeport(int fd, mach_port_t *portname);
          int fileport_makefd(mach_port_t portname);
          __END_DECLS
          #endif
          EOF
          cat external/darksword-kexploit/.include/sys/fileport.h
          ls -R external/darksword-kexploit/.include
      - name: Build darksword-kexploit (arm64/arm64e, iOS 15.0+)
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          make -C external/darksword-kexploit
          file external/darksword-kexploit/darksword-pe
          ls -lh external/darksword-kexploit/darksword-pe || true
          # Optional ldid signing (Theos ldid)
          if command -v ldid >/dev/null 2>&1; then ldid -Sentitlements.plist external/darksword-kexploit/darksword-pe && echo "signed"; else echo "ldid not found, skip sign (install via brew install ldid)"; fi
      - name: Build clipwire (arm64e, iOS 26.1 A13)
        run: |
          make -C external/clipwire
          file external/clipwire/clipwire
          ls -lh external/clipwire/clipwire || true
          if command -v ldid >/dev/null 2>&1; then ldid -Sentitlements.plist external/clipwire/clipwire; else echo "ldid not found"; fi
      - name: Verify bad_query sources
        run: |
          ls -lh external/bad_query/bad_query/bad_query.h external/bad_query/bad_query/bad_query.c
          cat external/bad_query/bad_query/bad_query.h
      - name: Upload exploit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exploit-binaries
          path: |
            external/darksword-kexploit/darksword-pe
            external/clipwire/clipwire

  lint-app:
    runs-on: macos-14
    needs: build-exploits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -p; xcodebuild -version; swift --version
      - name: Lint Swift sources (syntax check)
        run: |
          echo "Checking Swift syntax with swiftc -typecheck (iOS 15.0+)"
          # Verify bridging headers exist
          ls -lh HyperGestalt/HyperGestalt-Bridging-Header.h HyperGestalt/Bridging/DarkswordBridge.h HyperGestalt/Bridging/include/sys/fileport.h || true
          ls -lh external/bad_query/bad_query/bad_query.h external/clipwire/src/clipwire.h external/darksword-kexploit/src/main.m
          # Typecheck Swift files without full build (allow incomplete Xcode project)
          find HyperGestalt/Sources -name "*.swift" -print -exec swiftc -typecheck -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios15.0 {} \; 2>&1 | head -100 || echo "swiftc typecheck completed with warnings (expected without full project)"
          echo "Swift sources lint done"
      - name: Validate project structure
        run: |
          ls -R HyperGestalt 2>&1 | head -100
          ls -R external 2>&1 | head -50
          cat HyperGestalt/README.md | head -40
